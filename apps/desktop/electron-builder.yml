# Fabrication des installeurs : npm run dist (à la racine).
# Pas encore de certificat : macOS en signature « ad hoc », Windows non signé.
appId: io.github.abeverat.hibou
productName: Hibou
copyright: Copyright © 2026 abeverat — MIT
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
# Noms sans version : les liens « releases/latest/download/… » du README restent valables.
artifactName: ${productName}-${os}-${arch}.${ext}
# Taille : on ne garde que les traductions de Chromium utiles (menus contextuels, dialogues)
# et la compression maximale. Les langues suivent celles du menu natif (main/langue.ts).
electronLanguages: [fr, en, en-GB, de, es, it, pt, pt-BR, nl, el]
compression: maximum

mac:
  target:
    # Deux fichiers séparés plutôt qu'un « universel » qui embarque les deux (taille ×2).
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.education
  identity: '-' # signature ad hoc (indispensable sur Apple Silicon), sans compte Apple Developer
  hardenedRuntime: false
  notarize: false
dmg:
  artifactName: ${productName}-mac-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: false
  perMachine: false # installation pour l'utilisateur, sans droits administrateur
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-windows-setup.${ext}

publish:
  provider: github
  owner: abeverat
  repo: hibou
  releaseType: release
